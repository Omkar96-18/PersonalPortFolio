<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0d"/>
      <stop offset="100%" style="stop-color:#14141a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F62440"/>
      <stop offset="100%" style="stop-color:#800A1C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle red top border accent -->
  <rect x="0" y="0" width="64" height="2.5" rx="14" fill="url(#redGrad)" opacity="0.9"/>

  <!-- "37" text centered -->
  <text
    x="32"
    y="44"
    font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="-2"
    text-anchor="middle"
    fill="#FFFFFF"
    filter="url(#glow)"
  >3<tspan fill="url(#redGrad)">7</tspan></text>

  <!-- Bottom-right micro dot indicator -->
  <circle cx="54" cy="54" r="3" fill="#F62440" opacity="0.85"/>
</svg>