<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>devil37 | Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect trick.
    // Saves the full path/query/hash, then redirects to index.html
    // so React Router can pick it up and route correctly.
    var segmentCount = 1; // number of path segments in the base URL (1 for /PersonalPortFolio/)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.split('/').slice(1 + segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
